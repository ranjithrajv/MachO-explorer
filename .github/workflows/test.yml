# Verify the tools on every platform Node runs on.
#
# The reason this file exists at all is that the test suite used to depend on
# which binaries happened to be installed on the machine running it. On a bare
# CI runner it found none of them, exited 2, and "checked nothing" looked exactly
# like "failed". The generated fixture corpus is what makes a green run mean
# something, so CI is where it has to be exercised — including on the platforms
# whose system binaries cannot possibly be present.
#
# Four jobs, deliberately:
#
#   fixtures  — build the corpus and confirm the checked-in binaries match what
#               the generator produces. A stale or hand-edited fixture is a test
#               that no longer tests, and it would otherwise go unnoticed.
#   test      — the reader suite, on macOS, Linux and Windows.
#   protocol  — the MCP server, the agent skill, the declared types, the publish
#               contract, the SARIF emitter, the composite action, the published page
#               and the documentation site, on Linux.
#   mutation  — prove the suite fails when the reader is broken. Slow, and the
#               job most likely to rot, so it runs on its own rather than
#               blocking every push's test job.
#
# The `protocol` job is named for what it started as and now also carries the
# type, publish, SARIF and action suites. Renaming it to match its contents would
# mean renaming it on every addition; what they share is that none is reachable by
# testing the reader — one drives a subprocess, one holds prose to the tree, one
# holds the declared contract to the code, one asks whether the package can ship,
# one checks a format translation, and one runs a CI gate's shell.
name: test

on:
  push:
    # `main`, because this package is published as its own repository — the
    # standalone clone a reviewer gets from the npm page or the GitHub link has
    # `main`, and a trigger naming a branch that does not exist there is a
    # workflow that never runs, which looks identical to one that passes. The
    # workspace this was extracted from uses `master`; see the root ci.yml, whose
    # trigger is `master` for the mirror reason.
    branches: [main]
  pull_request:
  workflow_dispatch:

# `checkout` and `setup-node` are pinned to v7, the first major that runs on the
# `node24` runtime. v4 still works, but it warns on every run that it targets
# Node 20 and is being force-upgraded — noise in a log whose only job is to make
# a failure legible. `checkout@v7` needs Actions Runner ≥ v2.327.1, which every
# GitHub-hosted runner is; a fork on an old self-hosted runner would stay on v6.

jobs:
  fixtures:
    name: fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: The checked-in fixtures match the generator
        run: node test/fixtures.mjs --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is here for a specific reason: the reader claims to be
        # platform-independent, and the only way to keep that claim honest is to
        # run it where there is no /usr/bin to fall back on. The system-binary
        # half of the suite skips there; the fixture half is the whole point.
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the fixture corpus
        run: node test/fixtures.mjs
      - name: Run the suite
        run: node test/smoke.mjs
      # The instruction-length tables, in their own suite because the risk they
      # carry is different in kind: a wrong length is always a plausible number,
      # so nothing about the output reveals it and only a table of expectations
      # can. `disasm.mjs` also holds the `__stubs` stride oracle, which reads host
      # binaries and therefore skips on Linux and Windows — the fixture half of
      # the same file is what runs there, which is the reason it is worth running
      # in all three places rather than on macOS alone.
      - name: The instruction decoders
        run: node test/disasm.mjs

  # The MCP server and the skill are separate suites because they check
  # different things and neither is a subset of `smoke.mjs`.
  #
  # `mcp.mjs` spawns subprocesses and parses every byte they write, so it is slow
  # and it is the one place a stray `console.log` would be caught rather than
  # shipped. `skill.mjs` holds prose to the tree, which is the check that stops a
  # documented flag from quietly becoming a no-op.
  #
  # Linux only, and deliberately: both spawn Node subprocesses and neither reads
  # a platform-specific system binary for its assertions — the string fixture
  # exists so they do not need one. Running them on one platform is enough to catch
  # the failure they exist for, and three platforms of them would slow every push
  # for coverage they would not add.
  protocol:
    name: mcp protocol, agent skill, and the publish contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the fixture corpus
        run: node test/fixtures.mjs
      # The browser bundle is generated and committed, so it can go stale. This
      # is the same drift discipline `fixtures --check` applies to the binary
      # corpus, applied to the one other generated artefact.
      - name: The browser bundle matches its sources
        run: node demo/link.mjs --check
      - name: The browser bundle is the reader, and answers the same
        run: node test/browser.mjs
      - name: The conformance corpus is a working oracle
        run: node test/conformance.mjs
      - name: The MCP server over a real pipe
        run: node test/mcp.mjs
      - name: The agent skill matches the tools
        run: node test/skill.mjs
      # A suite that asserts what no amount of reader testing can reach.
      #
      # `publish.mjs` asserts the package can actually be shipped and that the
      # docs name it. `npm publish --dry-run` cannot: it packed this package,
      # printed `+ MachO-Tools@0.1.0` and exited 0 on a name npm refuses,
      # because a dry run does not ask the registry whether a name is
      # acceptable. So the one command that looks like the check reported success
      # on the one thing that was broken.
      #
      # Linux only, like the rest of this job: it reads the repository, spawns
      # nothing platform-specific, and asserts nothing that differs by OS.
      - name: The package can be published and the docs name it
        run: node test/publish.mjs

      # The per-tool JSON Schemas are generated from the same `data` shapes the
      # tools emit, and this is the check that keeps them honest. `--check` fails
      # if any checked-in schema has drifted from what the generator produces — the
      # same drift discipline `fixtures --check` and `demo/link.mjs --check` apply,
      # applied to the one artefact category that had none. Then `schemas.mjs` runs
      # every tool's real output through its own schema and asserts the schemas
      # *reject* wrong documents, because a validator that accepts everything would
      # pass every positive check above and be found by nobody.
      #
      # Regenerating in CI and then checking would be theatre; it only generates,
      # never writes.
      - name: The checked-in schemas match the generator
        run: npm run schema:check
      - name: Every tool's output validates, and the schemas reject what they should
        run: npm run test:schemas

      # SARIF and the composite action are the CI-gate surface, and neither is
      # reachable by testing the reader.
      #
      # `sarif.mjs` holds the emitter to the SARIF 2.1.0 members a consumer
      # depends on. The check that bites is that every `ruleId` appears in the
      # declared rule catalog: an undeclared one is not an error to a consumer, it
      # is a finding rendered with no name attached, so it ships and nobody sees
      # it.
      #
      # `action.mjs` extracts the shell out of `action.yml` and runs it. That is
      # the only way to test a composite action — its steps are shell, nothing
      # type-checks them, and the file parses as valid YAML whether the shell
      # inside it is correct or not. It found three real defects the first time
      # it ran, one of which would have made a failing gate report green.
      #
      # Linux only, and for the same reason as everything else in this job: the
      # three-OS matrix is what keeps the reader's cross-platform claim honest,
      # and these check integration shape, which does not vary by OS.
      - name: The SARIF emitter is well-formed
        run: node test/sarif.mjs
      - name: The composite action's shell actually runs
        run: node test/action.mjs
      # The Pages site is assembled with `cp`, and the failure that matters is not
      # a failing `cp` — it is a source file the audit panel fetches that nobody
      # copied, which gives a dead "view source" button on a page whose entire
      # argument is that you can verify its claims. That is a silent failure, so
      # it gets an explicit suite. It also asserts the no-external-origin rule,
      # because a CDN link would mean the reader being audited is not the reader
      # that ran — and the visitor could not tell.
      # A .tbd is read by a parser written for the format, and its failure mode
      # is a well-formed wrong answer: half the symbols with the right install name
      # and nothing saying the rest were missed. So the suite asserts the reader
      # REFUSES a stub it did not fully understand, and — when a real SDK is present
      # — that every stub in it parses with zero unrecognised lines. The fixtures are
      # verbatim excerpts of Apple's own files, not files written to match the parser.
      - name: A text stub is read completely, or the answer is withheld
        run: node test/tbd.mjs
      - name: The published page is this repository
        run: node test/pages.mjs
      # The documentation site is rendered by a from-scratch markdown renderer, so
      # its tests are about the *renderer* rather than the seven documents it ships.
      # `test/docs.mjs` asserts from the output side — no leftover markdown syntax in
      # any page, every anchor resolves, every page has a source — because the
      # failure mode of a hand-rolled renderer is degrading quietly rather than
      # throwing. Two emphasis bugs got through here and were caught only by the
      # leftover-syntax assertion.
      - name: The documentation site renders, and --check detects drift
        run: node test/docs.mjs

  mutation:
    name: mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Confirm the suite fails when the reader is broken
        run: node test/mutation-check.mjs
