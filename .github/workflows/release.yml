# Publish to npm when a version tag is pushed.
#
# `npm publish` is not run by hand anywhere in this project's docs, because the
# hand-run version is the one that skips the suite: `npm publish --dry-run`
# reports success on a name the registry refuses, and a maintainer in a hurry
# believes it. This workflow is the only publish path, and it re-runs the gate
# first — a tag that does not pass does not ship.
#
# The tag is the version. `v0.1.0` must match `package.json`'s `version`, or the
# publish ships a tarball whose name disagrees with the tag it was cut from.
name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance (SLSA attestation) needs this
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: The tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # The whole gate, not a hand-picked subset. `test:all` is the same suite a
      # contributor runs, so a tag that does not pass it does not ship — and the
      # list this replaced was a subset, which is exactly how the suites guarding
      # the `.d.ts`, the schemas and the Action — the artefacts a published
      # package actually ships — could be skipped before a publish. It is also
      # self-maintaining: a suite added to `test:all` is in the gate, and one
      # added only to a test file that nobody wires in is a red that nobody runs.
      - name: The full gate
        run: npm run test:all

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
