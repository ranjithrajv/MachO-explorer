# Build and release standalone binaries via GitHub Releases.
#
# Node 22's built-in SEA (Single Executable Application) support bundles the
# JS source and a Node runtime into one native binary — no external build
# dependencies, no cross-compilation. Each platform builds on its own runner.
#
# Triggered by pushing a version tag (v*). Creates a draft GitHub Release
# with all binaries attached. The release is created as a draft so a human
# can review before publishing.
#
# Binaries are named: <tool>-<platform>-<arch>[.exe]
#   macho-explorer-darwin-arm64, describe-linux-x64, sym-win-x64.exe, ...
name: release-binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `macos-latest` is Apple Silicon; the Intel runner is labelled
          # separately. `macos-13` was retired, so a tag pointing at it queues
          # forever with an "unsupported label" message rather than failing.
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 25+ is required, not optional: `mainFormat: "module"` — the
          # field that runs the injected script as ESM — does not exist in Node
          # 22 or 24, and the tools are ESM. On 22 the embedder treats the main
          # as CommonJS and dies at the first `import`.
          node-version: '26'

      # postject is the standard tool for injecting the SEA blob into the node
      # binary. It is a build-time tool only — the shipped binaries have zero
      # runtime dependencies. `npx` runs it on demand rather than `npm install`,
      # so this repository keeps no `node_modules` and no lockfile to satisfy a
      # tool that is not part of the package.
      #
      # `postject` has no `--version`; `--help` is the flag it actually answers,
      # and it exercises the same npx-mediated lookup the build depends on.
      - name: Confirm postject is reachable
        run: npx --yes postject --help

      - name: Build SEA binaries
        run: node scripts/build-sea.mjs --output-dir dist

      # Injecting a blob leaves the Mach-O unsigned, and an unsigned binary
      # downloaded from a release is quarantined and SIGKILLed by Gatekeeper on
      # first run — verified locally, where it exits 137 before printing
      # anything. An ad-hoc signature is enough for the ad-hoc assessment that
      # quarantine triggers, so `xattr -d com.apple.quarantine` is not needed
      # by the person who downloads it.
      - name: Ad-hoc sign the macOS binaries
        if: runner.os == 'macOS'
        run: |
          for f in dist/*; do
            codesign --sign - --force --timestamp=none "$f"
          done

      # Runs the binary, so a broken build cannot reach the release. `shell:
      # bash` is explicit because the default on a Windows runner is PowerShell,
      # where this `case` would be a syntax error rather than a test.
      - name: Smoke-test a built binary
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   bin="describe-darwin-${{ matrix.arch }}" ;;
            Linux)   bin="describe-linux-x64" ;;
            Windows) bin="describe-win-x64.exe" ;;
          esac
          chmod +x "dist/$bin" 2>/dev/null || true
          "dist/$bin" --help
          # `--help` proves the binary starts; this proves it reads a real file,
          # which is the path the embedded version asset and the parser take.
          "dist/$bin" test/fixtures/universal.macho > /dev/null
          echo "::notice::built and ran $bin"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  release:
    name: create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: sha256sum dist/* > dist/checksums.txt

      - name: Generate release notes
        id: notes
        env:
          # Via `env`, not `${{ }}` inside the script: a `${{ }}` is substituted
          # into the shell text before it runs, so a crafted input would be
          # executed as shell rather than treated as a tag.
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          # On a tag push GITHUB_REF_NAME is the tag; on workflow_dispatch it is
          # the branch that was selected, which is never a valid release tag.
          # Testing the input first keeps a manual run from publishing a release
          # named after `main`.
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "refusing to release: '$tag' is not a v<version> tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Generate a simple changelog from the tag
          echo "## MachO-explorer $tag" > release-notes.md
          echo "" >> release-notes.md
          echo "Standalone binaries — no Node.js install required." >> release-notes.md
          echo "" >> release-notes.md
          echo "### Available tools" >> release-notes.md
          echo "" >> release-notes.md
          echo "Each tool is available as a standalone binary for macOS (arm64, x64), Linux (x64), and Windows (x64)." >> release-notes.md
          echo "" >> release-notes.md
          echo "The unified \`macho-explorer <subcommand>\` dispatcher is **not** among them:" >> release-notes.md
          echo "it loads subcommands with dynamic imports, which cannot be bundled into a" >> release-notes.md
          echo "single file. Use \`npx macho-explorer\` for the dispatcher, or the per-tool" >> release-notes.md
          echo "binaries below — each one takes the same flags as its subcommand." >> release-notes.md
          echo "" >> release-notes.md
          echo "| Tool | Description |" >> release-notes.md
          echo "|---|---|" >> release-notes.md
          echo "| \`describe\` | What is in this binary? |" >> release-notes.md
          echo "| \`overview\` | Whole structural picture in one call |" >> release-notes.md
          echo "| \`sym\` | Search symbol table |" >> release-notes.md
          echo "| \`symlookup\` | vaddr-to-function lookup |" >> release-notes.md
          echo "| \`findcall\` | Direct call/jmp xrefs |" >> release-notes.md
          echo "| \`findliteral\` | Byte literal search / string listing |" >> release-notes.md
          echo "| \`mapliteral\` | Literal-to-address-to-pointers mapping |" >> release-notes.md
          echo "| \`a2o\` | Address-to-file-offset |" >> release-notes.md
          echo "| \`o2a\` | File-offset-to-address |" >> release-notes.md
          echo "| \`dump\` | Bytes at an address, bounded by its section |" >> release-notes.md
          echo "| \`starts\` | Function start addresses (LC_FUNCTION_STARTS) |" >> release-notes.md
          echo "| \`assert\` | CI assertions on symbols and strings |" >> release-notes.md
          echo "| \`disasm\` | Instruction boundary/branch decoding |" >> release-notes.md
          echo "| \`audit\` | Structural consistency check |" >> release-notes.md
          echo "| \`fingerprint\` | Program identity fingerprinting |" >> release-notes.md
          echo "| \`diff\` | Structural diff between two binaries |" >> release-notes.md
          echo "| \`mcp\` | MCP server (JSON-RPC over stdin/stdout) |" >> release-notes.md
          echo "| \`tbd\` | What a .tbd text stub exports |" >> release-notes.md
          echo "| \`symbolicate\` | Crash-report addresses to named frames |" >> release-notes.md
          echo "" >> release-notes.md
          echo "### Usage" >> release-notes.md
          echo "" >> release-notes.md
          echo '```sh' >> release-notes.md
          echo '# macOS / Linux — pick the binary for your platform' >> release-notes.md
          echo 'chmod +x describe-darwin-arm64' >> release-notes.md
          echo './describe-darwin-arm64 /usr/local/go/bin/go' >> release-notes.md
          echo '' >> release-notes.md
          echo '# Windows' >> release-notes.md
          echo '.\\describe-win-x64.exe C:\\Windows\\System32\\notepad.exe' >> release-notes.md
          echo '```' >> release-notes.md
          echo "" >> release-notes.md
          echo "Verify a download against the published \`checksums.txt\`." >> release-notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: MachO-explorer ${{ steps.notes.outputs.tag }}
          body_path: release-notes.md
          draft: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
